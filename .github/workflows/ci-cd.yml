name: CI/CD & Chrome Web Store Publish

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  # 1. PR 단계: 버전 증가 여부 및 빌드 사전 검증
  check-version-and-build:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Get PR version
        id: pr_version
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          path: master-branch

      - name: Get master version
        id: master_version
        run: echo "version=$(jq -r .version master-branch/package.json)" >> $GITHUB_OUTPUT

      - name: Compare versions
        run: |
          PR_VER="${{ steps.pr_version.outputs.version }}"
          MASTER_VER="${{ steps.master_version.outputs.version }}"
          echo "PR Version: $PR_VER"
          echo "Master Version: $MASTER_VER"
          if [ "$PR_VER" == "$MASTER_VER" ]; then
            echo "Error: package.json version must be updated before merging!"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Build with Vite
        run: bun run build

  # 2. master 병합 단계: Chrome Web Store 배포 + GitHub Release 배포
  publish:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release 및 Tag 생성을 위해 쓰기 권한 필요

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build with Vite
        run: bun run build

      - name: Create Extension Zip
        run: |
          cd dist
          zip -r ../extension.zip .
          cd ..

      - name: Upload & Publish to Chrome Web Store
        run: |
          bunx chrome-webstore-upload-cli upload --source extension.zip
          bunx chrome-webstore-upload-cli publish
        env:
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.PUBLISHER_ID }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Release ${{ steps.get_version.outputs.tag_name }}
          files: extension.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
